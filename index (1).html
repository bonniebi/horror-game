<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>지하 7층</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; color: #d8d2c4;
    font-family: "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", -apple-system, sans-serif;
    user-select: none; -webkit-user-select: none; touch-action: none; }
  canvas { display: block; }

  /* ---------- 화면 효과 ---------- */
  #vignette { position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0) 45%, rgba(0,0,0,.85) 100%); }
  #danger { position: fixed; inset: 0; pointer-events: none; opacity: 0;
    background: radial-gradient(ellipse at center, rgba(120,0,0,0) 35%, rgba(150,0,0,.75) 100%); }
  #grain { position: fixed; inset: -50%; pointer-events: none; opacity: .13; mix-blend-mode: screen;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }
  #flash { position: fixed; inset: 0; pointer-events: none; background: #fff; opacity: 0; }

  /* ---------- HUD ---------- */
  #hud { position: fixed; left: 20px; bottom: 20px; display: none; flex-direction: column; gap: 8px;
    font-size: 13px; letter-spacing: .04em; opacity: .85; }
  #fuses { font-size: 15px; font-weight: 700; color: #e9b65a; text-shadow: 0 0 8px rgba(233,182,90,.4); }
  .bar { display: flex; align-items: center; gap: 8px; }
  .bar .lbl { width: 46px; color: #9c968a; font-size: 11px; }
  .track { width: 140px; height: 5px; background: rgba(255,255,255,.12); border-radius: 3px; overflow: hidden; }
  .track > div { height: 100%; width: 100%; border-radius: 3px; transition: background .3s; }
  #batt { background: #e8dcb0; } #stam { background: #9fb7a0; }
  #msg { position: fixed; left: 50%; bottom: 22%; transform: translateX(-50%); width: min(90vw, 640px);
    text-align: center; font-size: 17px; letter-spacing: .06em; color: #e6dccb; opacity: 0;
    text-shadow: 0 0 12px #000, 0 0 4px #000; transition: opacity .6s; pointer-events: none; }
  #crosshair { position: fixed; left: 50%; top: 50%; width: 4px; height: 4px; margin: -2px 0 0 -2px;
    border-radius: 50%; background: rgba(255,255,255,.35); display: none; pointer-events: none; }

  /* ---------- 오버레이 화면 ---------- */
  .overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: radial-gradient(ellipse at center, rgba(25,8,8,.82), rgba(0,0,0,.96)); z-index: 10; padding: 16px; }
  .panel { max-width: 560px; width: 100%; text-align: center; }
  .overlay h1 { font-size: clamp(44px, 11vw, 78px); font-weight: 900; letter-spacing: .12em; color: #b31212;
    text-shadow: 0 0 24px rgba(200,0,0,.45), 3px 3px 0 #200; font-family: "Nanum Myeongjo", "Batang", serif;
    animation: shake 4s infinite; }
  .overlay h2 { font-size: clamp(30px, 8vw, 50px); font-weight: 900; letter-spacing: .1em; margin-bottom: 12px;
    font-family: "Nanum Myeongjo", "Batang", serif; }
  .sub { color: #8a8378; font-size: 13px; letter-spacing: .35em; margin: 6px 0 26px; }
  .story { font-size: 15px; line-height: 1.9; color: #cfc6b6; margin-bottom: 24px; }
  .story b { color: #e9b65a; font-weight: 700; }
  .story em { color: #c43a3a; font-style: normal; }
  .keys { display: grid; grid-template-columns: auto auto; gap: 6px 18px; justify-content: center;
    font-size: 13px; color: #9c968a; margin-bottom: 28px; text-align: left; }
  .keys kbd { display: inline-block; min-width: 22px; padding: 1px 7px; border: 1px solid #4a4440; border-radius: 4px;
    background: #1a1614; color: #e0d6c4; font-family: inherit; font-size: 12px; text-align: center; margin-right: 3px; }
  .btn { background: transparent; color: #e6dccb; border: 1px solid #7a1a1a; padding: 13px 38px; font-size: 16px;
    letter-spacing: .3em; cursor: pointer; font-family: inherit; transition: all .25s; }
  .btn:hover, .btn:active { background: #7a1a1a; color: #fff; box-shadow: 0 0 24px rgba(180,0,0,.5); }
  .stats { color: #9c968a; font-size: 14px; line-height: 1.9; margin-bottom: 26px; }
  .hidden { display: none !important; }
  @keyframes shake { 0%, 92%, 100% { transform: translate(0,0); } 93% { transform: translate(-3px, 2px); }
    94% { transform: translate(3px,-2px); } 95% { transform: translate(-2px,-1px); } 96% { transform: translate(0,0); } }

  /* ---------- 터치 컨트롤 ---------- */
  #touch { position: fixed; inset: 0; display: none; z-index: 5; }
  #joyBase { position: absolute; width: 110px; height: 110px; border-radius: 50%; border: 2px solid rgba(255,255,255,.18);
    background: rgba(255,255,255,.04); display: none; transform: translate(-50%,-50%); pointer-events: none; }
  #joyKnob { position: absolute; left: 50%; top: 50%; width: 46px; height: 46px; margin: -23px 0 0 -23px; border-radius: 50%;
    background: rgba(255,255,255,.22); }
  .tbtn { position: absolute; width: 62px; height: 62px; border-radius: 50%; border: 2px solid rgba(255,255,255,.25);
    background: rgba(0,0,0,.35); color: #ddd; font-size: 24px; display: flex; align-items: center; justify-content: center; }
  .tbtn.on { border-color: #e9b65a; box-shadow: 0 0 14px rgba(233,182,90,.45); }
  #tFlash { right: 24px; bottom: 110px; } #tRun { right: 100px; bottom: 34px; }
  @media (pointer: coarse) { #hud { top: 16px; bottom: auto; left: 16px; } #msg { bottom: 34%; font-size: 15px; } }
</style>
</head>
<body>
<div id="danger"></div>
<div id="flash"></div>
<div id="crosshair"></div>

<div id="hud">
  <div id="fuses">퓨즈 0 / 5</div>
  <div class="bar"><span class="lbl">손전등</span><div class="track"><div id="batt"></div></div></div>
  <div class="bar"><span class="lbl">체력</span><div class="track"><div id="stam"></div></div></div>
</div>
<div id="msg"></div>

<div id="touch">
  <div id="joyBase"><div id="joyKnob"></div></div>
  <div class="tbtn on" id="tFlash">🔦</div>
  <div class="tbtn" id="tRun">🏃</div>
</div>

<!-- 시작 화면 -->
<div class="overlay" id="startScreen">
  <div class="panel">
    <h1>지하 7층</h1>
    <div class="sub">B 7 · 폐 병 원</div>
    <p class="story">
      눈을 떴을 때, 당신은 폐쇄된 병원의 지하에 있었다.<br>
      비상 출구는 전원이 끊겨 잠겨 있다.<br>
      흩어진 <b>퓨즈 5개</b>를 찾아 출구를 열어야 한다.<br>
      <em>그것</em>은 빛을 보고, 소리를 듣는다.
    </p>
    <div class="keys" id="keysDesktop">
      <div><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd></div><div>이동</div>
      <div><kbd>마우스</kbd></div><div>둘러보기</div>
      <div><kbd>Shift</kbd></div><div>달리기 (소리가 커져요)</div>
      <div><kbd>F</kbd></div><div>손전등 켜기 / 끄기</div>
      <div><kbd>Esc</kbd></div><div>일시정지</div>
    </div>
    <div class="keys hidden" id="keysTouch">
      <div>왼쪽 화면</div><div>드래그해서 이동</div>
      <div>오른쪽 화면</div><div>드래그해서 둘러보기</div>
      <div>🔦 / 🏃</div><div>손전등 · 달리기</div>
    </div>
    <button class="btn" id="startBtn">들어간다</button>
    <p class="sub" style="margin-top:22px;letter-spacing:.1em">🎧 이어폰 착용을 권장합니다</p>
  </div>
</div>

<div class="overlay hidden" id="pauseScreen">
  <div class="panel">
    <h2 style="color:#cfc6b6">일시정지</h2>
    <p class="stats">숨을 고르는 동안에도, 그것은 기다리고 있다.</p>
    <button class="btn" id="resumeBtn">계속하기</button>
  </div>
</div>

<div class="overlay hidden" id="endScreen">
  <div class="panel">
    <h2 id="endTitle"></h2>
    <p class="stats" id="endStats"></p>
    <button class="btn" id="restartBtn">다시 하기</button>
  </div>
</div>

<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

/* =========================================================
   설정
   ========================================================= */
const TILE = 2.5, WALL_H = 3.0, EYE = 1.6, PR = 0.3;   // 타일 크기, 벽 높이, 눈높이, 플레이어 반경
const MW = 9, MH = 9, GW = MW * 2 + 1, GH = MH * 2 + 1; // 미로 셀 수 → 타일 그리드
const FUSE_COUNT = 5, BATT_COUNT = 5;
const DIRS = [[1, 0], [-1, 0], [0, 1], [0, -1]];
const isTouch = matchMedia('(pointer: coarse)').matches;
const $ = id => document.getElementById(id);
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const tileCenter = (x, z) => new THREE.Vector3(x * TILE + TILE / 2, 0, z * TILE + TILE / 2);

/* =========================================================
   렌더러 / 씬
   ========================================================= */
const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);
const FOG_DENSITY = 0.085;
scene.fog = new THREE.FogExp2(0x000000, FOG_DENSITY);

const camera = new THREE.PerspectiveCamera(72, innerWidth / innerHeight, 0.05, 90);
camera.rotation.order = 'YXZ';
scene.add(camera);
scene.add(new THREE.HemisphereLight(0x3a3a48, 0x140a0a, 0.07));

// 손전등
const flashlight = new THREE.SpotLight(0xffeccc, 24, 26, 0.55, 0.85, 1.4);
flashlight.position.set(0.22, -0.18, 0.1);
flashlight.target.position.set(0.05, -0.05, -1);
camera.add(flashlight, flashlight.target);
// 아주 약한 주변광(손전등을 꺼도 바로 앞은 겨우 보이게)
const nearGlow = new THREE.PointLight(0x6a6a88, 0.28, 4, 1.5);
camera.add(nearGlow);

// 후처리: 색수차, 화면 일그러짐, 필름 노이즈, 비네트 (공포도에 따라 강해짐)
const rtSize = () => [Math.floor(innerWidth * renderer.getPixelRatio()), Math.floor(innerHeight * renderer.getPixelRatio())];
const rt = new THREE.WebGLRenderTarget(...rtSize(), { type: THREE.HalfFloatType });
const postScene = new THREE.Scene(), postCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
const postMat = new THREE.ShaderMaterial({
  uniforms: { tDiffuse: { value: rt.texture }, uTime: { value: 0 }, uFear: { value: 0 }, uGlitch: { value: 0 }, uRes: { value: new THREE.Vector2(...rtSize()) } },
  vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }',
  fragmentShader: `
    uniform sampler2D tDiffuse; uniform float uTime, uFear, uGlitch; uniform vec2 uRes; varying vec2 vUv;
    float hash(vec2 p){ return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }
    void main(){
      vec2 c = vUv - 0.5;
      vec2 uv = 0.5 + c * (1.0 + dot(c, c) * (0.1 + uFear * 0.25));
      float line = floor(uv.y * 48.0);
      float tear = step(1.0 - uGlitch * 0.4, hash(vec2(line, floor(uTime * 24.0))));
      uv.x += tear * (hash(vec2(line, uTime)) - 0.5) * 0.12 * uGlitch;
      uv += vec2(sin(uv.y * 28.0 + uTime * 6.0), cos(uv.x * 22.0 + uTime * 4.0)) * 0.002 * uFear;
      float ab = 0.004 + uFear * 0.02 + uGlitch * 0.05;
      vec4 col = vec4(texture2D(tDiffuse, uv + c * ab).r, texture2D(tDiffuse, uv).g, texture2D(tDiffuse, uv - c * ab).b, 1.0);
      gl_FragColor = col;
      #include <tonemapping_fragment>
      #include <colorspace_fragment>
      float l = dot(gl_FragColor.rgb, vec3(0.299, 0.587, 0.114));
      gl_FragColor.rgb = mix(gl_FragColor.rgb, vec3(l), 0.35);
      gl_FragColor.rgb = mix(gl_FragColor.rgb, gl_FragColor.rgb * vec3(1.3, 0.7, 0.65), uFear * 0.7);
      gl_FragColor.rgb += (hash(vUv * uRes + fract(uTime) * 91.0) - 0.5) * (0.08 + uFear * 0.1 + uGlitch * 0.2);
      gl_FragColor.rgb *= smoothstep(0.82, 0.2, length(c) * (1.05 + uFear * 0.25));
      gl_FragColor.rgb *= 0.95 + 0.05 * hash(vec2(floor(uTime * 24.0), 1.0));
      if (uv.x < 0.0 || uv.x > 1.0 || uv.y < 0.0 || uv.y > 1.0) gl_FragColor.rgb = vec3(0.0);
    }`,
  depthTest: false, depthWrite: false
});
const postQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), postMat); postQuad.frustumCulled = false; postScene.add(postQuad);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  rt.setSize(...rtSize()); postMat.uniforms.uRes.value.set(...rtSize());
});

/* =========================================================
   절차적 텍스처
   ========================================================= */
function canvasTex(size, draw, rx = 1, ry = rx) {
  const c = document.createElement('canvas'); c.width = c.height = size;
  const g = c.getContext('2d'); draw(g, size);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace; t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(rx, ry); t.anisotropy = 4;
  return t;
}
function speckle(g, s, alpha, n) {
  for (let i = 0; i < n; i++) {
    const v = (Math.random() * 255) | 0;
    g.fillStyle = `rgba(${v},${v},${v},${alpha})`;
    g.fillRect(Math.random() * s, Math.random() * s, 1 + Math.random() * 2, 1 + Math.random() * 2);
  }
}
function stains(g, s, n, color, maxR = 0.25) {
  for (let i = 0; i < n; i++) {
    const x = Math.random() * s, y = Math.random() * s, r = 8 + Math.random() * s * maxR;
    const gr = g.createRadialGradient(x, y, 0, x, y, r);
    gr.addColorStop(0, color); gr.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = gr; g.fillRect(x - r, y - r, r * 2, r * 2);
  }
}
function drips(g, s, n, rgb, top = 0) {
  for (let i = 0; i < n; i++) {
    const x = Math.random() * s, y = top + Math.random() * 10, len = 20 + Math.random() * 130;
    const gr = g.createLinearGradient(0, y, 0, y + len);
    gr.addColorStop(0, `rgba(${rgb},.55)`); gr.addColorStop(1, `rgba(${rgb},0)`);
    g.fillStyle = gr; g.fillRect(x, y, 1 + Math.random() * 3, len);
  }
}
function drawWall(g, s, bloody) {
  g.fillStyle = '#6a6e62'; g.fillRect(0, 0, s, s);
  g.fillStyle = '#485046'; g.fillRect(0, s * 0.62, s, s * 0.38);       // 아래쪽 페인트
  g.fillStyle = '#2b2e28'; g.fillRect(0, s * 0.6, s, 5);                // 몰딩
  speckle(g, s, 0.08, 7000);
  stains(g, s, 16, 'rgba(45,32,14,.35)');
  drips(g, s, 22, '30,22,10');
  g.strokeStyle = 'rgba(18,18,16,.6)'; g.lineWidth = 1;
  for (let i = 0; i < 6; i++) {
    let x = Math.random() * s, y = Math.random() * s; g.beginPath(); g.moveTo(x, y);
    for (let j = 0; j < 9; j++) { x += (Math.random() - .5) * 30; y += Math.random() * 18; g.lineTo(x, y); }
    g.stroke();
  }
  // 벗겨진 페인트
  for (let i = 0; i < 6; i++) {
    g.fillStyle = 'rgba(150,150,135,.25)';
    g.beginPath(); const x = Math.random() * s, y = Math.random() * s;
    g.ellipse(x, y, 4 + Math.random() * 14, 3 + Math.random() * 8, Math.random() * 3, 0, Math.PI * 2); g.fill();
  }
  const gr = g.createLinearGradient(0, s * .78, 0, s);
  gr.addColorStop(0, 'rgba(0,0,0,0)'); gr.addColorStop(1, 'rgba(8,6,4,.75)');
  g.fillStyle = gr; g.fillRect(0, s * .78, s, s * .22);
  if (bloody) {
    // 피 묻은 손자국/얼룩
    for (let i = 0; i < 3; i++) {
      const x = rand(s * .15, s * .85), y = rand(s * .25, s * .7);
      g.fillStyle = 'rgba(95,6,6,.85)';
      g.beginPath(); g.ellipse(x, y, 11, 13, 0, 0, Math.PI * 2); g.fill();
      for (let f = 0; f < 5; f++) {
        const a = -Math.PI / 2 + (f - 2) * 0.38 + (f === 0 ? 0.5 : 0);
        g.beginPath(); g.ellipse(x + Math.cos(a) * 18, y + Math.sin(a) * 18, 3.2, 7, a + Math.PI / 2, 0, Math.PI * 2); g.fill();
      }
      drips(g, s, 6, '90,4,4', y);
    }
    g.strokeStyle = 'rgba(85,5,5,.75)'; g.lineWidth = 9; g.lineCap = 'round';
    g.beginPath(); g.moveTo(rand(0, s * .3), rand(s * .3, s * .5));
    g.bezierCurveTo(s * .4, rand(s * .2, s * .6), s * .6, rand(s * .3, s * .7), rand(s * .7, s), rand(s * .4, s * .6)); g.stroke();
  }
}
const wallMat = new THREE.MeshStandardMaterial({ map: canvasTex(256, (g, s) => drawWall(g, s, false)), roughness: 0.92 });
const bloodWallMat = new THREE.MeshStandardMaterial({ map: canvasTex(256, (g, s) => drawWall(g, s, true)), roughness: 0.9 });
const floorTex = canvasTex(256, (g, s) => {
  g.fillStyle = '#3c3a35'; g.fillRect(0, 0, s, s);
  const n = 4, w = s / n;
  for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) {
    const v = 92 + Math.random() * 30, c = (i + j) % 2 ? v : v - 22;
    g.fillStyle = `rgb(${c},${c - 4},${c - 10})`; g.fillRect(i * w + 2, j * w + 2, w - 4, w - 4);
  }
  speckle(g, s, 0.1, 6000);
  stains(g, s, 12, 'rgba(30,22,10,.45)', .3);
  stains(g, s, 2, 'rgba(70,5,5,.35)', .15);
}, GW + 2);
const floorMat = new THREE.MeshStandardMaterial({ map: floorTex, roughness: 0.8 });
const ceilMat = new THREE.MeshStandardMaterial({
  map: canvasTex(256, (g, s) => {
    g.fillStyle = '#4a4a46'; g.fillRect(0, 0, s, s);
    g.strokeStyle = '#2a2a28'; g.lineWidth = 3;
    for (let i = 0; i <= 2; i++) { g.beginPath(); g.moveTo(i * s / 2, 0); g.lineTo(i * s / 2, s); g.moveTo(0, i * s / 2); g.lineTo(s, i * s / 2); g.stroke(); }
    speckle(g, s, 0.1, 5000); stains(g, s, 14, 'rgba(40,30,12,.5)', .3);
  }, (GW + 2) / 2), roughness: 1
});

function textTex(text, color, w = 512, h = 256, font = 'bold 96px serif') {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d'); g.font = font; g.textAlign = 'center'; g.textBaseline = 'middle';
  for (let k = 0; k < 3; k++) { g.fillStyle = color; g.globalAlpha = .35; g.fillText(text, w / 2 + rand(-3, 3), h / 2 + rand(-3, 3)); }
  g.globalAlpha = 1; g.fillText(text, w / 2, h / 2);
  const m = g.measureText(text);
  for (let i = 0; i < 14; i++) {
    const x = w / 2 + rand(-m.width / 2, m.width / 2), y = h / 2 + rand(10, 40), len = rand(10, 80);
    const gr = g.createLinearGradient(0, y, 0, y + len); gr.addColorStop(0, color); gr.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = gr; g.fillRect(x, y, rand(2, 5), len);
  }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
function signTex(text, bg, fg) {
  const c = document.createElement('canvas'); c.width = 256; c.height = 96;
  const g = c.getContext('2d');
  g.fillStyle = bg; g.fillRect(0, 0, 256, 96);
  g.strokeStyle = fg; g.lineWidth = 4; g.strokeRect(6, 6, 244, 84);
  g.fillStyle = fg; g.font = 'bold 40px sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText(text, 128, 50);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}

/* =========================================================

   월드 구축

let world = null, items = [], lamps = [], exitDoor = null, exitBlock = null, exitSignMat = null, exitLight = null;
const S = { // 게임 상태
  state: 'menu', time: 0, fuses: 0, doorOpen: false, doorT: 0,
  player: { pos: new THREE.Vector3(), yaw: 0, pitch: 0, stamina: 100, exhausted: false, battery: 100, flash: true, bob: 0, moving: false, sprinting: false },
  m: null, heartT: 0, breathT: 0, whisperT: 25, bangT: 14, deathT: 0, introShown: false,
  fear: 0, glitch: 0, blackout: 0, followT: 40, followN: 0, followStepT: 0, followD: 5

function disposeWorld() {

}
function buildWorld() {
  disposeWorld();
  generateMaze();
  world = new THREE.Group(); scene.add(world);
  items = []; lamps = [];

  // 바닥/천장
  const size = (GW + 2) * TILE;
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(size, size), floorMat);
  floor.rotation.x = -Math.PI / 2; floor.position.set(GW * TILE / 2, 0, GH * TILE / 2); world.add(floor);
  const ceil = new THREE.Mesh(new THREE.PlaneGeometry(size, size), ceilMat);
  ceil.rotation.x = Math.PI / 2; ceil.position.set(GW * TILE / 2, WALL_H, GH * TILE / 2); world.add(ceil);

  // 벽 (인스턴싱)
  const normal = [], bloody = [];
  for (let z = 0; z < GH; z++) for (let x = 0; x < GW; x++) {
    if (!grid[z][x] || (x === exitTile.x && z === exitTile.z)) continue;
    let near = false;
    for (let dz = -1; dz <= 1; dz++) for (let dx = -1; dx <= 1; dx++) if (!isWallTile(x + dx, z + dz)) near = true;
    if (near) (Math.random() < 0.08 ? bloody : normal).push([x, z]);
  }
  const wallGeo = new THREE.BoxGeometry(TILE, WALL_H, TILE);
  const dummy = new THREE.Object3D();
  for (const [list, mat] of [[normal, wallMat], [bloody, bloodWallMat]]) {
    const im = new THREE.InstancedMesh(wallGeo, mat, list.length);
    list.forEach(([x, z], i) => { dummy.position.set(x * TILE + TILE / 2, WALL_H / 2, z * TILE + TILE / 2); dummy.updateMatrix(); im.setMatrixAt(i, dummy.matrix); });
    world.add(im);
  }

  // 출구
  const ec = tileCenter(exitTile.x, exitTile.z);
  exitBlock = new THREE.Mesh(wallGeo.clone(), wallMat); exitBlock.position.set(ec.x, WALL_H / 2, ec.z); world.add(exitBlock);
  const doorMat = new THREE.MeshStandardMaterial({ color: 0x5b6058, roughness: 0.5, metalness: 0.6,
    map: canvasTex(128, (g, s) => { g.fillStyle = '#6b706a'; g.fillRect(0, 0, s, s); speckle(g, s, .15, 2500); stains(g, s, 8, 'rgba(70,35,10,.55)', .3); g.fillStyle = '#2b2b2b'; g.fillRect(s * .78, s * .48, s * .12, s * .05); }) });
  exitDoor = new THREE.Mesh(new THREE.BoxGeometry(0.12, 2.3, 1.5), doorMat);
  exitDoor.position.set(exitTile.x * TILE - 0.06, 1.15, ec.z); world.add(exitDoor);
  exitSignMat = new THREE.MeshBasicMaterial({ map: signTex('비상구', '#300', '#ff3b2f'), fog: false });
  const sign = new THREE.Mesh(new THREE.PlaneGeometry(0.9, 0.34), exitSignMat);
  sign.position.set(exitTile.x * TILE - 0.02, 2.62, ec.z); sign.rotation.y = -Math.PI / 2; world.add(sign);
  exitLight = new THREE.PointLight(0xff2a1a, 1.2, 5, 1.5); exitLight.position.set(exitTile.x * TILE - 0.6, 2.5, ec.z); world.add(exitLight);

  // 아이템 배치
  const dist = bfs(1, 1), cells = [];
  for (let z = 1; z < GH; z += 2) for (let x = 1; x < GW; x += 2) {
    let open = 0; for (const [dx, dz] of DIRS) if (!isWallTile(x + dx, z + dz)) open++;
    cells.push({ x, z, d: dist[x + z * GW], dead: open === 1 });
  }
  const used = new Set(['1,1']);
  const far = (c, list, md) => list.every(o => Math.abs(o.x - c.x) + Math.abs(o.z - c.z) >= md);
  const fuses = [];
  const cand = cells.filter(c => c.d > 8).sort((a, b) => (b.dead - a.dead) || (Math.random() - .5));
  for (const md of [8, 6, 4, 2]) for (const c of cand) { if (fuses.length >= FUSE_COUNT) break; if (!used.has(c.x + ',' + c.z) && far(c, fuses, md)) { fuses.push(c); used.add(c.x + ',' + c.z); } }
  fuses.forEach(c => addItem('fuse', c));
  const rest = cells.filter(c => c.d > 4 && !used.has(c.x + ',' + c.z)).sort(() => Math.random() - .5);
  rest.slice(0, BATT_COUNT).forEach(c => { addItem('battery', c); used.add(c.x + ',' + c.z); });

  // 깜빡이는 천장등
  const lampCells = cells.filter(c => c.d > 3 && c.d < 999).sort(() => Math.random() - .5).slice(0, 5);
  for (const c of lampCells) {
    const p = tileCenter(c.x, c.z);
    const light = new THREE.PointLight(0xffd59a, 5, 9, 1.6); light.position.set(p.x, WALL_H - 0.35, p.z);
    const bulbMat = new THREE.MeshBasicMaterial({ color: 0xffe3b0 });
    const bulb = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.05, 0.18), bulbMat); bulb.position.set(p.x, WALL_H - 0.03, p.z);
    world.add(light, bulb); lamps.push({ light, bulbMat, base: 5, off: 0, t: rand(0, 3) });
  }

  // 피로 쓴 글씨
  const words = ['도망쳐', '불을 꺼', '뒤를 봐', '여기 있어', '나가지 마', '들린다'];
  const spots = cells.filter(c => c.d > 2).sort(() => Math.random() - .5);
  let wi = 0;
  for (const c of spots) {
    if (wi >= words.length) break;
    const dirs = DIRS.filter(([dx, dz]) => isWallTile(c.x + dx, c.z + dz) && !(c.x + dx === exitTile.x && c.z + dz === exitTile.z));
    if (!dirs.length) continue;
    const [dx, dz] = dirs[(Math.random() * dirs.length) | 0], p = tileCenter(c.x, c.z);
    const mat = new THREE.MeshStandardMaterial({ map: textTex(words[wi], 'rgba(120,6,6,.92)'), transparent: true, depthWrite: false, polygonOffset: true, polygonOffsetFactor: -2, roughness: 0.6 });
    const decal = new THREE.Mesh(new THREE.PlaneGeometry(1.8, 0.9), mat);
    decal.position.set(p.x + dx * (TILE / 2 - 0.02), rand(1.3, 1.9), p.z + dz * (TILE / 2 - 0.02));
    decal.rotation.y = Math.atan2(-dx, -dz); decal.rotation.z = rand(-0.12, 0.12);
    world.add(decal); wi++;
  }

  // 플레이어 & 괴물 초기화
  const pl = S.player;
  const sp = tileCenter(1, 1); pl.pos.set(sp.x, EYE, sp.z);
  pl.yaw = !grid[1][2] ? -Math.PI / 2 : Math.PI; pl.pitch = 0;
  pl.stamina = 100; pl.battery = 100; pl.flash = true; pl.exhausted = false;
  const farCell = cells.filter(c => c.d > 0).sort((a, b) => b.d - a.d)[0];
  const mp = tileCenter(farCell.x, farCell.z);
  S.m = { pos: new THREE.Vector3(mp.x, 0, mp.z), path: [], state: 'dormant', dormant: 9, chaseT: 0, repath: 0, stepT: 0, lastKnown: null, searchT: 0, dir: new THREE.Vector3(0, 0, 1), anim: 0 };
  monsterMesh.position.copy(S.m.pos); monsterMesh.visible = true; monsterMesh.scale.setScalar(1);
  Object.assign(S, { time: 0, fuses: 0, doorOpen: false, doorT: 0, heartT: 0, breathT: 0, whisperT: rand(20, 35), bangT: 9.5, deathT: 0, introShown: false,
    fear: 0, glitch: 0, blackout: 0, followT: rand(30, 45), followN: 0, followStepT: 0, followD: 5 });
  Object.assign(G, { active: null, t: rand(28, 40), behindDone: false }); ghostMesh.visible = false;
  monsterMesh.userData.mouth.scale.set(0.7, 1.5, 0.45);
  scene.fog.density = FOG_DENSITY;
  updateHUD();
}
function addItem(type, c) {
  const p = tileCenter(c.x, c.z), g = new THREE.Group();
  if (type === 'fuse') {
    const glass = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.07, 0.26, 10), new THREE.MeshStandardMaterial({ color: 0xffb347, emissive: 0xff8c1a, emissiveIntensity: 1.6, roughness: 0.3 }));
    glass.rotation.z = Math.PI / 2; g.add(glass);
    for (const s of [-1, 1]) { const cap = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 0.07, 10), new THREE.MeshStandardMaterial({ color: 0xb0b0b0, metalness: 0.9, roughness: 0.3 })); cap.rotation.z = Math.PI / 2; cap.position.x = s * 0.15; g.add(cap); }
  } else {
    const b = new THREE.Mesh(new THREE.BoxGeometry(0.11, 0.24, 0.11), new THREE.MeshStandardMaterial({ color: 0x2e8b57, emissive: 0x1c6b3a, emissiveIntensity: 1.1, roughness: 0.5 }));
    const top = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.025, 0.04, 8), new THREE.MeshStandardMaterial({ color: 0xcccccc, metalness: 0.8 }));
    top.position.y = 0.14; g.add(b, top);
  }
  g.position.set(p.x + rand(-0.4, 0.4), 0.55, p.z + rand(-0.4, 0.4));
  world.add(g); items.push({ type, mesh: g, phase: Math.random() * 6 });
}

const keys = {};
let pointerLocked = false, lockFailed = false, dragLook = false;
addEventListener('keydown', e => {
  keys[e.code] = true;
  if (e.code === 'KeyF' && S.state === 'playing') toggleFlash();
});
addEventListener('keyup', e => { keys[e.code] = false; });
const look = (dx, dy, k = 0.0022) => {
  const pl = S.player; pl.yaw -= dx * k; pl.pitch = clamp(pl.pitch - dy * k, -1.35, 1.35);
};
document.addEventListener('mousemove', e => {
  if (S.state !== 'playing' || isTouch) return;
  if (pointerLocked || (lockFailed && dragLook)) look(e.movementX, e.movementY);
});
renderer.domElement.addEventListener('mousedown', () => {
  if (S.state !== 'playing' || isTouch) return;
  if (lockFailed) dragLook = true; else if (!pointerLocked) requestLock();
});
addEventListener('mouseup', () => { dragLook = false; });
function requestLock() {
  try { const r = renderer.domElement.requestPointerLock(); if (r && r.catch) r.catch(() => { lockFailed = true; }); }
  catch { lockFailed = true; }
}
document.addEventListener('pointerlockchange', () => {
  pointerLocked = document.pointerLockElement === renderer.domElement;
  if (!pointerLocked && S.state === 'playing' && !isTouch && !lockFailed) pause();
});
document.addEventListener('pointerlockerror', () => { lockFailed = true; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });

// 터치
const touch = { joyId: null, jx: 0, jy: 0, ox: 0, oy: 0, lookId: null, lx: 0, ly: 0, run: false };
if (isTouch) {
  $('keysDesktop').classList.add('hidden'); $('keysTouch').classList.remove('hidden');
  const T = $('touch'), base = $('joyBase'), knob = $('joyKnob');
  T.addEventListener('touchstart', e => {
    for (const t of e.changedTouches) {
      if (t.target.classList.contains('tbtn')) continue;
      if (t.clientX < innerWidth * 0.45 && touch.joyId === null) {
        touch.joyId = t.identifier; touch.ox = t.clientX; touch.oy = t.clientY; touch.jx = touch.jy = 0;
        base.style.display = 'block'; base.style.left = t.clientX + 'px'; base.style.top = t.clientY + 'px'; knob.style.transform = '';
      } else if (touch.lookId === null) { touch.lookId = t.identifier; touch.lx = t.clientX; touch.ly = t.clientY; }
    }
    e.preventDefault();
  }, { passive: false });
  T.addEventListener('touchmove', e => {
    for (const t of e.changedTouches) {
      if (t.identifier === touch.joyId) {
        let dx = t.clientX - touch.ox, dy = t.clientY - touch.oy; const l = Math.hypot(dx, dy), m = 50;
        if (l > m) { dx *= m / l; dy *= m / l; }
        touch.jx = dx / m; touch.jy = dy / m; knob.style.transform = `translate(${dx}px,${dy}px)`;
      } else if (t.identifier === touch.lookId) {
        if (S.state === 'playing') look(t.clientX - touch.lx, t.clientY - touch.ly, 0.005);
        touch.lx = t.clientX; touch.ly = t.clientY;
      }
    }
    e.preventDefault();
  }, { passive: false });
  const end = e => {
    for (const t of e.changedTouches) {
      if (t.identifier === touch.joyId) { touch.joyId = null; touch.jx = touch.jy = 0; base.style.display = 'none'; }
      if (t.identifier === touch.lookId) touch.lookId = null;
    }
  };
  T.addEventListener('touchend', end); T.addEventListener('touchcancel', end);
  $('tFlash').addEventListener('touchstart', e => { e.preventDefault(); if (S.state === 'playing') toggleFlash(); });
  $('tRun').addEventListener('touchstart', e => { e.preventDefault(); touch.run = !touch.run; $('tRun').classList.toggle('on', touch.run); });
}

   게임 흐름

let msgTimer = null;
function showMsg(text, dur = 3.2) {
  const m = $('msg'); m.textContent = text; m.style.opacity = 1;
  clearTimeout(msgTimer); msgTimer = setTimeout(() => { m.style.opacity = 0; }, dur * 1000);
}
function toggleFlash() {
  const pl = S.player;
  if (!pl.flash && pl.battery <= 0) { showMsg('배터리가 없다...', 2); sfx.click(); return; }
  pl.flash = !pl.flash; sfx.click();
  if (isTouch) $('tFlash').classList.toggle('on', pl.flash);
}
function setPlayingUI(on) {
  $('hud').style.display = on ? 'flex' : 'none';
  $('crosshair').style.display = on && !isTouch ? 'block' : 'none';
  $('touch').style.display = on && isTouch ? 'block' : 'none';
}
function startGame() {
  initAudio();
  buildWorld();
  $('startScreen').classList.add('hidden'); $('endScreen').classList.add('hidden');
  if (isTouch) { $('tFlash').classList.add('on'); touch.run = false; $('tRun').classList.remove('on'); }
  S.state = 'playing'; setPlayingUI(true);
  if (!isTouch) requestLock();
  setTimeout(() => S.state === 'playing' && showMsg('퓨즈 5개를 찾아 비상구를 열어야 한다', 4), 800);
}
function pause() {
  S.state = 'paused'; setPlayingUI(false); $('pauseScreen').classList.remove('hidden');
  if (ac) ac.suspend();
}
function resume() {
  $('pauseScreen').classList.add('hidden'); S.state = 'playing'; setPlayingUI(true);
  if (ac) ac.resume();
  if (!isTouch) requestLock();
  clock.getDelta();
}
function endGame(win) {
  S.state = 'over'; setPlayingUI(false); setVoice(new THREE.Vector3(), 0, 1); hideGhost(false); $('msg').style.opacity = 0;
  if (document.pointerLockElement) document.exitPointerLock();
  const mm = Math.floor(S.time / 60), ss = String(Math.floor(S.time % 60)).padStart(2, '0');
  const t = $('endTitle');
  if (win) {
    t.textContent = '탈출했다'; t.style.color = '#d8d2c4';
    $('endStats').innerHTML = `차가운 새벽 공기가 폐를 채운다.<br>하지만 등 뒤의 문 너머에서, 무언가가 아직 숨 쉬고 있다.<br><br>생존 시간 ${mm}:${ss}`;
  } else {
    t.textContent = '잡혔다'; t.style.color = '#b31212';
    $('endStats').innerHTML = `지하 7층의 어둠이 당신을 삼켰다.<br><br>찾은 퓨즈 ${S.fuses} / ${FUSE_COUNT} · 버틴 시간 ${mm}:${ss}`;
  }
  $('endScreen').classList.remove('hidden');
}
$('startBtn').addEventListener('click', startGame);
$('restartBtn').addEventListener('click', startGame);
$('resumeBtn').addEventListener('click', resume);
addEventListener('keydown', e => { if (e.code === 'KeyP' && S.state === 'playing') { if (document.pointerLockElement) document.exitPointerLock(); else pause(); } });

function updateHUD() {
  $('fuses').textContent = `퓨즈 ${S.fuses} / ${FUSE_COUNT}`;
  const pl = S.player;
  $('batt').style.width = pl.battery + '%';
  $('batt').style.background = pl.battery < 20 ? '#c4473a' : '#e8dcb0';
  $('stam').style.width = pl.stamina + '%';
  $('stam').style.background = pl.exhausted ? '#7a5a4a' : '#9fb7a0';
}

/* =========================================================
   업데이트: 플레이어
   ========================================================= */
const _f = new THREE.Vector3(), _r = new THREE.Vector3();
function updatePlayer(dt) {
  const pl = S.player;
  let mx = 0, mz = 0;
  if (keys.KeyW || keys.ArrowUp) mz += 1;
  if (keys.KeyS || keys.ArrowDown) mz -= 1;
  if (keys.KeyD || keys.ArrowRight) mx += 1;
  if (keys.KeyA || keys.ArrowLeft) mx -= 1;
  if (isTouch) { mx += touch.jx; mz -= touch.jy; }
  const ml = Math.hypot(mx, mz); if (ml > 1) { mx /= ml; mz /= ml; }
  pl.moving = ml > 0.1;
  const wantRun = (keys.ShiftLeft || keys.ShiftRight || touch.run) && pl.moving && mz > -0.2;
  pl.sprinting = wantRun && !pl.exhausted && pl.stamina > 0;
  if (pl.sprinting) { pl.stamina -= 24 * dt; if (pl.stamina <= 0) { pl.stamina = 0; pl.exhausted = true; if (touch.run) { touch.run = false; $('tRun').classList.remove('on'); } } }
  else { pl.stamina = Math.min(100, pl.stamina + (pl.moving ? 11 : 17) * dt); if (pl.exhausted && pl.stamina > 35) pl.exhausted = false; }
  const speed = pl.sprinting ? 5.3 : 2.9;
  _f.set(-Math.sin(pl.yaw), 0, -Math.cos(pl.yaw)); _r.set(Math.cos(pl.yaw), 0, -Math.sin(pl.yaw));
  const vx = (_f.x * mz + _r.x * mx) * speed * dt, vz = (_f.z * mz + _r.z * mx) * speed * dt;
  if (!collides(pl.pos.x + vx, pl.pos.z, PR)) pl.pos.x += vx;
  if (!collides(pl.pos.x, pl.pos.z + vz, PR)) pl.pos.z += vz;

  // 머리 흔들림 + 발소리
  if (pl.moving) {
    const prev = Math.sin(pl.bob);
    pl.bob += dt * (pl.sprinting ? 13 : 8.5) * Math.min(1, ml);
    const cur = Math.sin(pl.bob);
    if ((prev > 0 && cur <= 0) || (prev < 0 && cur >= 0)) sfx.step(pl.sprinting);
  } else pl.bob += (Math.round(pl.bob / Math.PI) * Math.PI - pl.bob) * Math.min(1, dt * 6);
  const bobAmt = pl.sprinting ? 0.075 : 0.045;
  camera.position.set(pl.pos.x + Math.cos(pl.bob * 0.5) * bobAmt * 0.4, EYE + Math.abs(Math.sin(pl.bob)) * bobAmt - bobAmt / 2, pl.pos.z);
  camera.rotation.set(pl.pitch, pl.yaw, Math.sin(pl.bob * 0.5) * (pl.sprinting ? 0.012 : 0.006));

  // 숨소리
  if (pl.stamina < 35) { S.breathT -= dt; if (S.breathT <= 0) { sfx.breath(); S.breathT = pl.exhausted ? 0.75 : 1.2; } }

  // 손전등 배터리
  if (pl.flash) {
    pl.battery = Math.max(0, pl.battery - 0.85 * dt);
    if (pl.battery <= 0) { pl.flash = false; showMsg('손전등이 꺼졌다... 배터리를 찾아야 한다', 3); sfx.click(); if (isTouch) $('tFlash').classList.remove('on'); }
  }
  let fi = pl.flash ? 24 : 0;
  if (S.blackout > 0) { S.blackout -= dt; fi = 0; flashlight.intensity = 0; }
  if (pl.flash && pl.battery < 20 && Math.random() < (20 - pl.battery) / 60) fi *= Math.random() * 0.4;
  if (pl.flash && S.m && S.m.state === 'chase' && Math.random() < 0.04) fi *= 0.2; // 괴물이 가까우면 손전등이 떨린다
  flashlight.intensity += (fi - flashlight.intensity) * Math.min(1, dt * 25);
  flashlight.distance = 14 + pl.battery * 0.12;

  // 아이템 획득
  for (let i = items.length - 1; i >= 0; i--) {
    const it = items[i];
    it.mesh.rotation.y += dt * 1.5; it.mesh.position.y = 0.55 + Math.sin(S.time * 2 + it.phase) * 0.06;
    if (Math.hypot(it.mesh.position.x - pl.pos.x, it.mesh.position.z - pl.pos.z) < 0.95) {
      world.remove(it.mesh); items.splice(i, 1); sfx.pickup();
      if (it.type === 'fuse') {
        S.fuses++;
        if (S.fuses >= FUSE_COUNT) openExit();
        else if (S.fuses === 3) {
          lamps.forEach(L => { L.dead = true; }); S.blackout = 1.4; S.glitch = 0.8;
          sfx.bang(new THREE.Vector3(pl.pos.x + 3, 1.5, pl.pos.z + 3)); sfx.hit();
          setTimeout(() => showMsg('모든 불이 꺼졌다. 그것의 발소리가 빨라졌다...', 4), 1200);
        }
        if (S.fuses < 3 || S.fuses === 4) showMsg(`퓨즈를 찾았다 (${S.fuses} / ${FUSE_COUNT})`);
      } else {
        pl.battery = Math.min(100, pl.battery + 45); showMsg('배터리를 주웠다');
      }
    }
  }

  // 탈출
  if (S.doorOpen && pl.pos.x > exitTile.x * TILE + 0.4) endGame(true);
  updateHUD();
}
function openExit() {
  S.doorOpen = true; grid[exitTile.z][exitTile.x] = 0;
  exitSignMat.map = signTex('비상구', '#032', '#3bff6a'); exitSignMat.needsUpdate = true;
  exitLight.color.set(0x3bff6a); exitLight.intensity = 3;
  sfx.door();
  showMsg('멀리서 철문이 열리는 소리가 들렸다. 초록 불빛을 따라가라!', 4.5);
  // 괴물이 소리를 듣고 달려온다
  const m = S.m; m.state = 'chase'; m.chaseT = 8; m.lastKnown = toTile(S.player.pos); sfx.stinger();
  const beyond = new THREE.PointLight(0xcfe8ff, 6, 10, 1.2);
  beyond.position.set((exitTile.x + 1.5) * TILE, 1.8, exitTile.z * TILE + TILE / 2); world.add(beyond);
}

/* =========================================================
   업데이트: 괴물 AI
   ========================================================= */
function pickWanderTarget() {
  const pt = toTile(S.player.pos);
  for (let i = 0; i < 40; i++) {
    let x, z;
    if (Math.random() < 0.55) { x = pt.x + ((Math.random() * 13) | 0) - 6; z = pt.z + ((Math.random() * 13) | 0) - 6; } // 플레이어 근처를 배회
    else { x = (Math.random() * GW) | 0; z = (Math.random() * GH) | 0; }
    if (!isWallTile(x, z)) return { x, z };
  }
  return pt;
}
const _tmp = new THREE.Vector3();
function updateMonster(dt) {
  const m = S.m, pl = S.player, ud = monsterMesh.userData;
  const pp = _tmp.set(pl.pos.x, 0, pl.pos.z);
  const dist = m.pos.distanceTo(pp);
  const mt = toTile(m.pos), pt = toTile(pp);

  if (m.state === 'dormant') {
    m.dormant -= dt;
    if (m.dormant <= 0) { m.state = 'wander'; sfx.bang(m.pos.clone().setY(1.5)); showMsg('...어딘가에서 무언가 깨어났다', 3.5); }
  } else {
    // 감지
    const los = hasLOS(m.pos, pp);
    const seeRange = pl.flash ? 15 : 6.5;
    let sees = los && dist < seeRange;
    if (!sees && pl.flash && los && dist < 22) { // 손전등 빛을 정면으로 비추면 알아챈다
      _f.set(0, 0, -1).applyQuaternion(camera.quaternion);
      const to = m.pos.clone().setY(1.6).sub(camera.position).normalize();
      if (_f.dot(to) > 0.9) sees = true;
    }
    const hearR = pl.sprinting ? 12 : pl.moving ? 4.5 : 2.2;
    const hears = dist < hearR;
    if (sees || hears) {
      if (m.state !== 'chase') { sfx.stinger(); m.repath = 0; }
      m.state = 'chase'; m.chaseT = sees ? 7 : 4; m.lastKnown = pt;
    } else if (m.state === 'chase') {
      m.chaseT -= dt;
      if (m.chaseT <= 0) { m.state = 'search'; m.searchT = 10; m.path = findPath(mt.x, mt.z, m.lastKnown.x, m.lastKnown.z); }
    }

    // 경로
    m.repath -= dt;
    if (m.state === 'chase' && m.repath <= 0) { m.path = findPath(mt.x, mt.z, m.lastKnown.x, m.lastKnown.z); m.repath = 0.35; }
    if (m.state === 'search') { m.searchT -= dt; if (m.searchT <= 0) m.state = 'wander'; }
    if ((m.state === 'wander' || m.state === 'search') && !m.path.length) {
      const tgt = m.state === 'search' ? { x: m.lastKnown.x + ((Math.random() * 7) | 0) - 3, z: m.lastKnown.z + ((Math.random() * 7) | 0) - 3 } : pickWanderTarget();
      if (!isWallTile(tgt.x, tgt.z)) m.path = findPath(mt.x, mt.z, tgt.x, tgt.z);
    }

    // 이동
    const base = { wander: 1.7, search: 2.5, chase: 3.75 }[m.state] + S.fuses * 0.14;
    let speed = base, step = speed * dt, moved = false;
    if (m.state === 'chase' && los && dist < TILE * 1.6) {
      const d = pp.clone().sub(m.pos).setY(0).normalize();
      const nx = m.pos.x + d.x * step, nz = m.pos.z + d.z * step;
      if (!collides(nx, nz, 0.25)) { m.pos.x = nx; m.pos.z = nz; m.dir.lerp(d, 0.3); moved = true; }
    }
    if (!moved && m.path.length) {
      const tc = tileCenter(m.path[0].x, m.path[0].z), d = tc.sub(m.pos).setY(0), l = d.length();
      if (l < 0.08) m.path.shift();
      else { d.divideScalar(l); const s = Math.min(step, l); m.pos.addScaledVector(d, s); m.dir.lerp(d, Math.min(1, dt * 8)); moved = true; }
    }

    // 발소리
    if (moved) {
      m.stepT -= dt;
      if (m.stepT <= 0) { sfx.thud(m.pos.clone().setY(0.3), m.state === 'chase' ? 1 : 0.7); m.stepT = m.state === 'chase' ? 0.3 : 0.62; }
      m.anim += dt * speed * 2.6;
    }

    // 잡힘
    if (dist < 0.95) { triggerDeath(); return; }
  }

  // 모델 연출: 가까이서 추격할 땐 뚝뚝 끊기듯 움직인다
  m.jerkT = (m.jerkT || 0) - dt;
  if (m.state !== 'chase' || dist > 12 || m.jerkT <= 0) { monsterMesh.position.copy(m.pos); m.jerkT = rand(0.05, 0.16); }
  const faceDir = (m.state === 'chase' && dist < 8) ? pp.clone().sub(m.pos).setY(0).normalize() : m.dir;
  monsterMesh.rotation.y = Math.atan2(faceDir.x, faceDir.z);
  const sw = Math.sin(m.anim);
  ud.legs[0].rotation.x = sw * 0.55; ud.legs[1].rotation.x = -sw * 0.55;
  ud.arms[0].sh.rotation.x = -sw * 0.5 - (m.state === 'chase' ? 0.9 : 0.1); ud.arms[1].sh.rotation.x = sw * 0.5 - (m.state === 'chase' ? 0.9 : 0.1);
  ud.arms[0].fore.rotation.x = ud.arms[1].fore.rotation.x = m.state === 'chase' ? -0.6 : -0.15;
  ud.body.rotation.x = m.state === 'chase' ? 0.32 : 0.12;
  ud.body.position.y = Math.abs(Math.cos(m.anim)) * 0.05;
  ud.twitch -= dt;
  if (ud.twitch <= 0) { ud.head.rotation.set(rand(-0.35, 0.45), rand(-0.5, 0.5), rand(-0.9, 0.9)); ud.twitch = rand(0.05, m.state === 'chase' ? 0.25 : 1.4); }
  ud.hair.rotation.x = Math.sin(S.time * 1.3) * 0.04 + (m.state === 'chase' ? -0.15 : 0);

  // 공포 연출: 심장 소리, 붉은 화면
  const closeness = clamp(1 - (dist - 2) / 14, 0, 1);
  const chaseBoost = m.state === 'chase' ? 1 : 0.45;
  $('danger').style.opacity = (closeness * chaseBoost * 0.7).toFixed(3);
  S.fear = m.state === 'dormant' ? 0 : closeness * chaseBoost;
  setVoice(new THREE.Vector3(m.pos.x, 2.4, m.pos.z), m.state === 'dormant' ? 0 : m.state === 'chase' ? 0.7 : 0.35, m.state === 'chase' ? 1.6 : 0.45);
  if (m.state !== 'dormant' && dist < 16) {
    S.heartT -= dt;
    if (S.heartT <= 0) { sfx.heartbeat(0.25 + closeness * 0.75); S.heartT = 1.15 - closeness * 0.8; }
  }
}

/* =========================================================
   점프스케어
   ========================================================= */
function triggerDeath() {
  S.state = 'dying'; S.deathT = 0;
  sfx.scream();
  const pl = S.player;
  const m = S.m, d = m.pos.clone().sub(new THREE.Vector3(pl.pos.x, 0, pl.pos.z)).setY(0).normalize();
  pl.yaw = Math.atan2(-d.x, -d.z); pl.pitch = 0.05;
  S.lunge = d.clone(); S.glitch = 1; hideGhost(false); setVoice(new THREE.Vector3(pl.pos.x, EYE, pl.pos.z), 0, 1);
  monsterMesh.position.set(pl.pos.x + d.x * 2.6, EYE - 2.5, pl.pos.z + d.z * 2.6);
  monsterMesh.rotation.y = Math.atan2(-d.x, -d.z);
  const ud = monsterMesh.userData; ud.body.rotation.x = 0; ud.body.position.y = 0;
  ud.mouth.scale.set(1.0, 3.2, 0.5); setPlayingUI(false);
  ud.arms.forEach(a => { a.sh.rotation.x = -2.2; a.fore.rotation.x = -0.4; });
  S.blackout = 0; flashlight.intensity = 30; scene.fog.density = 0.02;
  $('danger').style.opacity = 1;
  $('flash').style.transition = 'none'; $('flash').style.opacity = 0.6;
  requestAnimationFrame(() => { $('flash').style.transition = 'opacity .4s'; $('flash').style.opacity = 0; });
}
function updateDying(dt) {
  S.deathT += dt;
  const pl = S.player, k = Math.max(0, 1 - S.deathT / 1.8);
  camera.position.set(pl.pos.x + rand(-1, 1) * 0.06 * k, EYE + rand(-1, 1) * 0.06 * k, pl.pos.z + rand(-1, 1) * 0.06 * k);
  camera.rotation.set(pl.pitch + rand(-1, 1) * 0.04 * k, pl.yaw + rand(-1, 1) * 0.04 * k, rand(-1, 1) * 0.06 * k);
  const ud = monsterMesh.userData;
  const lt = Math.min(1, S.deathT / 0.13), ld = 2.6 - (2.6 - 0.5) * lt * lt; // 순식간에 얼굴 앞까지 달려든다
  monsterMesh.position.set(pl.pos.x + S.lunge.x * ld, EYE - 2.52, pl.pos.z + S.lunge.z * ld);
  camera.fov = 72 - 14 * lt; camera.updateProjectionMatrix();
  S.glitch = Math.max(S.glitch, 0.7 * k); S.fear = 1;
  ud.head.rotation.set(rand(-0.25, 0.25), rand(-0.25, 0.25), rand(-0.6, 0.6));
  flashlight.intensity = Math.random() < 0.3 ? 2 : 30;
  if (S.deathT > 1.7) { camera.fov = 72; camera.updateProjectionMatrix(); endGame(false); }
}

/* =========================================================
   환영 (복도 끝에 서 있는 형체, 등 뒤의 무언가)
   ========================================================= */
function hideGhost(scare) {
  ghostMesh.visible = false; G.active = null;
  if (scare) { S.blackout = Math.max(S.blackout, 0.3); S.glitch = 1; }
}
function inView(pos, cosLimit) {
  _f.set(0, 0, -1).applyQuaternion(camera.quaternion);
  const to = new THREE.Vector3(pos.x, 1.9, pos.z).sub(camera.position).normalize();
  return _f.dot(to) > cosLimit && hasLOS(pos, camera.position);
}
function placeGhost(x, z) {
  const pl = S.player; ghostMesh.position.set(x, 0, z);
  ghostMesh.rotation.y = Math.atan2(pl.pos.x - x, pl.pos.z - z);
  const ud = ghostMesh.userData;
  ud.body.rotation.x = 0.05; ud.arms.forEach(a => { a.sh.rotation.x = 0; a.fore.rotation.x = 0; }); ud.legs.forEach(l => { l.rotation.x = 0; });
  ghostMesh.visible = true;
}
function spawnGlimpse() {
  const pl = S.player, fx = -Math.sin(pl.yaw), fz = -Math.cos(pl.yaw);
  let d = 0.5; while (d < 20 && !isWall(pl.pos.x + fx * d, pl.pos.z + fz * d)) d += 0.3;
  d = Math.min(d - 0.8, rand(7, 10));                       // 안개 속에서 겨우 보이는 거리
  if (d < 6 || !pl.flash) { G.t = 5; return; }               // 긴 복도를 볼 때까지 기다린다
  S.blackout = 0.45;                                          // 손전등이 깜빡 꺼졌다 켜지면… 거기 서 있다
  placeGhost(pl.pos.x + fx * d, pl.pos.z + fz * d);
  G.active = { type: 'glimpse', life: 9, seen: 0 };
}
function spawnBehind() {
  const pl = S.player, bx = pl.pos.x + Math.sin(pl.yaw) * 1.5, bz = pl.pos.z + Math.cos(pl.yaw) * 1.5;
  if (collides(bx, bz, 0.3)) { spawnGlimpse(); return; }
  placeGhost(bx, bz); G.behindDone = true;
  G.active = { type: 'behind', life: 6, caught: false };
  sfx.whisper(new THREE.Vector3(bx, 1.7, bz)); sfx.breath();
  setTimeout(() => G.active && G.active.type === 'behind' && showMsg('목덜미에 차가운 숨결이 닿았다', 2.5), 600);
}
function updateGhost(dt) {
  const pl = S.player;
  if (!G.active) {
    G.t -= dt;
    if (G.t <= 0 && S.m.state !== 'chase' && S.time > 25) {
      G.t = rand(35, 55);
      if (!G.behindDone && S.time > 75 && Math.random() < 0.6) spawnBehind(); else spawnGlimpse();
    }
    return;
  }
  const a = G.active, ud = ghostMesh.userData;
  a.life -= dt;
  ud.twitch -= dt;
  if (ud.twitch <= 0) { ud.head.rotation.set(rand(-0.2, 0.4), rand(-0.3, 0.3), rand(-0.9, 0.9)); ud.twitch = rand(0.3, 1.5); }
  const d = Math.hypot(ghostMesh.position.x - pl.pos.x, ghostMesh.position.z - pl.pos.z);
  if (a.type === 'glimpse') {
    if (S.blackout <= 0 && inView(ghostMesh.position, 0.94)) a.seen += dt;
    if (a.seen > 0.7 || d < 4) { sfx.hit(); hideGhost(true); }
    else if (a.life <= 0) hideGhost(false);
  } else {
    if (!a.caught && inView(ghostMesh.position, 0.7)) {
      a.caught = true; a.life = 0.3; sfx.hit(); sfx.scream(); S.glitch = 1;
      $('flash').style.transition = 'none'; $('flash').style.opacity = 0.35;
      requestAnimationFrame(() => { $('flash').style.transition = 'opacity .5s'; $('flash').style.opacity = 0; });
    }
    if (a.life <= 0) hideGhost(a.caught);
  }
}
// 내가 걸으면 따라 걷고, 멈추면 같이 멈추는 발소리
function updateFollowSteps(dt) {
  const pl = S.player;
  if (S.followN <= 0) {
    S.followT -= dt;
    if (S.followT <= 0 && S.m.state !== 'chase' && pl.moving && !pl.sprinting) { S.followN = 6; S.followD = 6; S.followStepT = 0.3; }
    return;
  }
  if (!pl.moving) { S.followN = 0; S.followT = rand(35, 60); return; }   // 멈추면… 발소리도 멈춘다
  S.followStepT -= dt;
  if (S.followStepT <= 0) {
    S.followD = Math.max(2.2, S.followD - 0.7);
    sfx.thud(new THREE.Vector3(pl.pos.x + Math.sin(pl.yaw) * S.followD, 0.3, pl.pos.z + Math.cos(pl.yaw) * S.followD), 0.45);
    S.followN--; S.followStepT = 0.55;
    if (S.followN <= 0) S.followT = rand(35, 60);
  }
}

/* =========================================================
   환경 연출
   ========================================================= */
function updateEnvironment(dt) {
  for (const L of lamps) {
    L.t -= dt;
    if (L.dead || S.blackout > 0) { L.light.intensity = 0; L.bulbMat.color.setHex(0x111110); continue; }
    if (L.off > 0) { L.off -= dt; L.light.intensity = 0; L.bulbMat.color.setHex(0x222018); }
    else {
      L.light.intensity = L.base * (0.85 + Math.random() * 0.15); L.bulbMat.color.setHex(0xffe3b0);
      if (L.t <= 0) { L.off = Math.random() < 0.3 ? rand(0.5, 2.5) : rand(0.03, 0.12); L.t = rand(0.1, 4); }
    }
  }
  // 문 열림
  if (S.doorOpen && S.doorT < 1) {
    S.doorT = Math.min(1, S.doorT + dt * 0.5);
    exitDoor.position.z = exitTile.z * TILE + TILE / 2 + S.doorT * 1.4;
    if (S.doorT > 0.3) exitBlock.visible = false;
  }
  // 무작위 속삭임과 소음
  S.whisperT -= dt;
  if (S.whisperT <= 0) {
    const pl = S.player; _f.set(Math.sin(pl.yaw), 0, Math.cos(pl.yaw)); // 뒤쪽
    sfx.whisper(new THREE.Vector3(pl.pos.x + _f.x * 1.2 + rand(-0.6, 0.6), 1.6, pl.pos.z + _f.z * 1.2 + rand(-0.6, 0.6)));
    S.whisperT = rand(25, 50);
  }
  S.bangT -= dt;
  if (S.bangT <= 0 && S.time > 20) {
    const pl = S.player, a = rand(0, Math.PI * 2);
    sfx.bang(new THREE.Vector3(pl.pos.x + Math.cos(a) * 12, 1.5, pl.pos.z + Math.sin(a) * 12));
    S.bangT = rand(30, 60);
  }
}

/* =========================================================
   메인 루프
   ========================================================= */
const clock = new THREE.Clock();
// 메뉴 배경: 천천히 미로를 떠도는 카메라
buildWorld();
let menuT = 0;
function loop() {
  requestAnimationFrame(loop);
  const dt = Math.min(clock.getDelta(), 0.05);
  if (S.state === 'playing') {
    S.time += dt;
    updatePlayer(dt);
    if (S.state === 'playing') updateMonster(dt);
    if (S.state === 'playing') { updateEnvironment(dt); updateGhost(dt); updateFollowSteps(dt); }
  } else if (S.state === 'dying') {
    updateDying(dt);
  } else if (S.state === 'menu') {
    menuT += dt * 0.15;
    const sp = tileCenter(1, 1);
    camera.position.set(sp.x, EYE, sp.z); camera.rotation.set(Math.sin(menuT * 0.7) * 0.05, S.player.yaw + Math.sin(menuT) * 0.6, 0);
    updateEnvironment(dt);
  }
  updateListener();
  S.glitch = Math.max(0, S.glitch - dt * 1.6);
  postMat.uniforms.uTime.value += dt;
  postMat.uniforms.uFear.value += ((S.state === 'playing' || S.state === 'dying' ? S.fear : 0) - postMat.uniforms.uFear.value) * Math.min(1, dt * 3);
  postMat.uniforms.uGlitch.value = S.glitch;
  renderer.setRenderTarget(rt); renderer.render(scene, camera);
  renderer.setRenderTarget(null); renderer.render(postScene, postCam);
}
loop();
</script>
